[[tool.uv.index]]
url = "https://pypi.org/simple"

[project]
name = "mcp-coffee-shop"
version = "0.1.0"
description = "A Model Context Protocol server for a coffee shop"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-adk>=1.28.1",
    "h11>=0.16.0",
    "jupyter-server>=2.18.0",
    "jupyterlab>=4.5.7",
    "litellm>=1.83.7",
    "lxml>=6.1.0",
    "markdownify>=0.13.1",
    "mcp[cli]>=1.23.0",
    "nltk>=3.9.3",
    "notebook>=7.5.6",
    "protego>=0.3.1",
    "pydantic>=2.0.0",
    "pygments>=2.20.0",
    "python-dotenv>=1.2.2",
    "readabilipy>=0.2.0",
    "requests>=2.33.0",
    "starlette>=1.0.1",
    "urllib3>=2.7.0",
]

[project.scripts]
mcp-coffee-shop = "mcp_coffee_shop:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = ["pyright>=1.1.389", "ruff>=0.7.3"]
